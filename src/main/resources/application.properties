spring.application.name=AgentIo

# DataSource 설정
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=hojunseo
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate 설정
# 앱 실행 시 엔티티에 맞춰 테이블을 자동 생성/수정 (운영에서는 validate 권장)
spring.jpa.hibernate.ddl-auto=update
# 콘솔에 실행되는 SQL문 출력
spring.jpa.show-sql=true
# 콘솔에 출력되는 SQL문을 예쁘게 정렬
spring.jpa.properties.hibernate.format_sql=true

# .env 파일을 설정 파일로 함께 읽기 (파일이 없어도 에러 안 나게 optional)
spring.config.import=optional:file:.env[.properties]
security.remember-me.key=${REMEMBER_ME_KEY}

# 서버에서 유저 세션 유지기간 설정. 너무 길면 서버에 많은 유저들이 그 시간동안 저장되어 무리가 갈 수 있음.
server.servlet.session.timeout=1200


## Oauth2 설정
spring.security.oauth2.client.registration.google.client-id=${OAUTH2_GOOGLE_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_GOOGLE_SECRET}
spring.security.oauth2.client.registration.github.client-id=${OAUTH2_GITHUB_ID}
spring.security.oauth2.client.registration.github.client-secret=${OAUTH2_GITHUB_SECRET}
